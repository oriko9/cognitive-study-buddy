name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # An explicit runner image, not the moving tag: a runner alias that drifts is
    # the same defect as a model alias that drifts, and check:pins rejects both.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # The Node major lives in .nvmrc and nowhere else (L8). A workflow that
      # restated it would drift from the developer's machine and produce the
      # "works locally, fails in CI" failure.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run verify

      - run: npm run check:pins

      # Last because it builds. Kept out of npm run verify for the same reason:
      # a slow common gate is a gate people learn to skip.
      - run: npm run check:secrets
